name: guzia-high-school

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghs
      POSTGRES_PASSWORD: ghs_dev_password
      POSTGRES_DB: ghs
    ports:
      - "5434:5432"
    volumes:
      - ghs-pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghs -d ghs"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ghs-pgdata:
